[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bookmarks2desktop"
version = "0.1.0"
dependencies = []
requires-python = ">=3.9"
authors = [
    { name = "Johan Nilsson", email = "oliver_twistor@hotmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }

[project.scripts]
bookmarks2desktop = "bookmarks2desktop.__main__:main"

[project.urls]
"Author Homepage" = "https://github.com/olivertwistor"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
